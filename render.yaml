services:
  - type: web
    name: youpiper-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MAX_CONCURRENT
        value: 2
      - key: YTDLP_PLAYER_CLIENT
        value: ios,mweb,web_safari,android

      - key: ALLOWED_ORIGINS
        value: https://youpiper.ytd-web.workers.dev,http://127.0.0.1:4321,http://localhost:4321
